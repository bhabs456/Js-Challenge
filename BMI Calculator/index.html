<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
        font-family: Arial, sans-serif;
      }

      .bmi-calculator {
        background: lightgreen;
        padding: 25px;
        border-radius: 15px;
        width: 300px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;

        text-align: center;
        gap: 15px;

        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
      }

      .bmi-calculator h1 {
        margin-bottom: 10px;
      }

      .height,
      .weight {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      input {
        padding: 8px;
        border: 1px solid #aaa;
        border-radius: 15px;
        font-size: 16px;
        text-align: center;
        outline: none;
      }

      button {
        padding: 10px;
        border: none;
        border-radius: 15px;
        background: #333;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #555;
      }

      #content {
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="bmi-calculator">
      <h1>BMI Calculator</h1>
      <div class="height">
        <p>Height (cm)</p>
        <input type="number" name="Height" id="height" value="0"/>
      </div>

      <div class="weight">
        <p>Weight (Kg)</p>
        <input type="number" name="Weight" id="weight" value="0" />
      </div>

      <button onclick="calculate()">Calculate</button>
      <p id="result"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
