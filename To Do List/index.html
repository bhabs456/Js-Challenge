<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
</head>
<body>
  <style>
    *{
      padding: 0;
      margin: 0;
    }
    .container{
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(135deg, #153677, #4e085f);
      padding: 10px;
    }

    .todo-app{
      width: 100%;
      max-width: 540px;
      background: #fff;
      margin: 100px auto 20px;
      padding: 40px 30px 70px;
      border-radius: 10px;
    }

    .todo-app h2{
      color: #002765;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .row{
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #edeef0;
      border-radius: 30px;
      padding-left: 20px;
      margin-bottom: 25px;
    }

    input{
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      outline: none;
      font-weight: 14px;
    }

    button{
      border: none;
      outline: none;
      padding: 16px 50px;
      background: #ff5945;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      border-radius: 40px;
    }

    ul li{
      list-style: none;
      position: relative;
      font-size: 17px;
      padding: 12px 8px 12px 50px;
      user-select: none;
      cursor: pointer;
    }

    ul li.checked{
      color: #555;
      text-decoration: line-through;
    }

    ul li span{
      position: absolute;
      right: 0;
      top: 5px;
      width: 40px;
      height: 40px;
      font-size: 22px;
      color: #555;
      line-height: 40px;
      text-align: center;
      border-radius: 50%;
    }

    ul li span:hover{
      background: #edeef0;

    }


  </style>

  <div class="container">
    <div class="todo-app">
      <h2>To-Do List</h2>
      <div class="row">
        <input type="text" id="input-box" placeholder="Enter Tasks...">
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="list-container">
        <!-- <li class="checked">Task 1</li>
        <li>Task 2</li>
        <li>Task 3</li> -->
      </ul>
    </div>
  </div>

  <script src="script.js"> </script>
</body>
</html>
