<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>To-Do List</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .todo-container {
        background-color: white;

        width: 450px;
        padding: 30px;

        border-radius: 10px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
      }

      .input-section {
        display: flex;
        gap: 10px;
      }

      #taskInput {
        flex: 1;

        padding: 12px;

        border: 1px solid #ccc;
        border-radius: 5px;

        font-size: 16px;
      }

      #addBtn {
        padding: 12px 18px;

        border: none;
        border-radius: 5px;

        background-color: #333;
        color: white;

        cursor: pointer;
      }

      #addBtn:hover {
        background-color: #555;
      }

      #taskList {
        list-style: none;
        margin-top: 25px;
      }

      #taskList li {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 12px;

        margin-bottom: 10px;

        background-color: #f5f5f5;

        border-radius: 5px;
      }

      .delete-btn {
        border: none;

        padding: 7px 12px;

        background-color: #333;
        color: white;

        border-radius: 4px;

        cursor: pointer;
      }

      .delete-btn:hover {
        background-color: #555;
      }
    </style>
  </head>

  <body>
    <div class="todo-container">
      <h1>To-Do List</h1>

      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter a task..." />

        <button id="addBtn" onclick="addTask()">Add Task</button>
      </div>

      <ul id="taskList">
        <!-- <li>
          <span>Learn HTML</span>
          <button class="delete-btn">Delete</button>
        </li>

        <li>
          <span>Practice JavaScript</span>
          <button class="delete-btn">Delete</button>
        </li> -->
      </ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
