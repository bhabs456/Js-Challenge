<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 300px;
            padding: 20px;
            background: #222;
            border-radius: 15px;
        }

        .display {
            width: 100%;
            height: 60px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 28px;
            text-align: right;
            border: none;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .operator {
            background: orange;
        }

        .clear {
            background: red;
            color: white;
        }

        .equal {
            background: green;
            color: white;
        }

        .cross{
            color: red;
            background: lightpink;
        }
    </style>
    
</head>

<body>

    <div class="calculator">

        <input type="text" class="display" placeholder="0" >

        <div class="buttons">
            <button class="clear" onclick>C</button>
            <button class="cross">X</button>
            <button class="operator">%</button>
            <button class="operator">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>

    </div>


    <script src="script.js">

    </script>
</body>
</html>
