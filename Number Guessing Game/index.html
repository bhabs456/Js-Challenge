<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guess Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
      }

      .container {
        width: 100%;
        max-width: 450px;
        text-align: center;
        background: #1f2937;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
      }

      h1 {
        font-size: 32px;
        margin-bottom: 10px;
      }

      .container > p {
        color: #9ca3af;
        margin-bottom: 25px;
      }

      .game-box {
        background: #111827;
        padding: 25px;
        border-radius: 15px;
      }

      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #374151;
        border-radius: 10px;
        background: #1f2937;
        color: white;
        font-size: 16px;
        text-align: center;
        outline: none;
        margin-bottom: 15px;
      }

      input:focus {
        border-color: #6366f1;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #6366f1;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #4f46e5;
      }

      #message {
        margin: 20px 0;
        color: #d1d5db;
      }

      .container2 {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }

      .container2 div {
        flex: 1;
        padding: 15px;
        background: #1f2937;
        border-radius: 10px;
      }

      .container2 span {
        display: block;
        color: #9ca3af;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .container2 strong {
        font-size: 22px;
      }

      #newGameBtn {
        background: #374151;
      }

      #newGameBtn:hover {
        background: #4b5563;
      }

      @media (max-width: 500px) {
        .container {
          padding: 25px 20px;
        }

        h1 {
          font-size: 27px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Guess The Number</h1>
      <p>Guess a number between 1 and 100</p>

      <div class="game-box">
        <input type="number" id="guessInput" placeholder="Enter your guess" />

        <button id="guessBtn">Guess</button>

        <p id="message">Enter a number between 1 and 100</p>

        <div class="container2">
          <div>
            <span>Attempts</span>
            <strong id="attempts">0</strong>
          </div>

          <div>
            <span>Best Score</span>
            <strong id="bestScore">-</strong>
          </div>
        </div>

        <button id="newGameBtn" onclick="newGame()">New Game</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
