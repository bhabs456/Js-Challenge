<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password hide/show</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: lightgray;
      }

      .input-box {
        width: 90%;
        max-width: 300px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background: lightseagreen;
        padding: 10px 30px;
        border-radius: 15px;
      }

      .input-box input {
        padding: 10px;
        width: 100%;
        outline: none;
        border: none;
        border-radius: 15px;
      }

      .input-box svg{
        position: absolute;
        right: 40px;
      }
    </style>

  </head>
  <body>
    <div class="input-box">
      <input
        type="password"
        id="input-password"
        placeholder="Enter Password..."
      />
      <svg
        xmlns="http://www.w3.org/2000/svg"
        xmlns:serif="http://www.serif.com/"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        id="eye-icon"
        fill="#000000"
        width="20px"
        height="20px"
        viewBox="0 0 32 32"
        style="
          fill-rule: evenodd;
          clip-rule: evenodd;
          stroke-linejoin: round;
          stroke-miterlimit: 2;
        "
        version="1.1"
        xml:space="preserve"
      >
        <g id="SVGRepo_bgCarrier" stroke-width="0" />

        <g
          id="SVGRepo_tracerCarrier"

          />

          <g id="Icon" />

      </svg>
    </div>

    <script src="script.js"></script>

</html>
