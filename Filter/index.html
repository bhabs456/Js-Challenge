<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Search Bar</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: bisque;
        font-family: Arial, sans-serif;
      }

      .search-box {
        width: 100%;
        max-width: 550px;
        background-color: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .row {
        display: flex;
        gap: 10px;
      }

      #input-box {
        flex: 1;
        padding: 14px 16px;
        border: 2px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 16px;
      }

      #input-box:focus {
        border-color: #555;
      }

      .row button {
        padding: 14px 22px;
        border: none;
        border-radius: 8px;
        background-color: #222;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .row button:hover {
        background-color: #444;
      }

      .result-box {
        margin-top: 10px;
      }

      .result-box ul {
        list-style: none;
      }

      .result-box li {
        padding: 13px 15px;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
      }

      .result-box li:hover {
        background-color: #f1f1f1;
      }

      @media (max-width: 600px) {
        .search-box {
          margin: 20px;
        }

        .row {
          flex-direction: column;
        }

        .row button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="search-box">
      <div class="row">
        <input
          type="text"
          name="text"
          id="input-box"
          placeholder="Search please..."
          autocomplete="off"
        />
        <button>Search</button>
      </div>
      <div class="result-box">
        
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
